name: Render Keep-Alive Heartbeat

on:
  schedule:
    # Run every 10 minutes to stay well within Render's 15-minute idle spin-down window
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keepalive:
    name: Ping Render Backend
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping GET / (Keep-Alive with Cold-Start Resilience)
        run: |
          echo "Sending keep-alive ping to Dormi backend root endpoint..."
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 60 --max-time 90 --retry 3 --retry-delay 5 --retry-all-errors https://dormi-backend-b12o.onrender.com/)
          echo "Response HTTP Status: $STATUS"
          if [ "$STATUS" -ge 200 ] && [ "$STATUS" -lt 400 ]; then
            echo "Render instance is awake and responsive."
            exit 0
          else
            echo "Warning: Received unexpected status $STATUS from Render instance."
            exit 1
          fi
